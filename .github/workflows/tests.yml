
name: NewHireToPayroll CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/newhire_payroll
      PAYROLL_API_URL: http://127.0.0.1:8000/payroll/employees
      PAYROLL_API_KEY: ci-test-key-not-real
      MAX_ATTEMPTS: "3"
      RETRY_BASE_DELAY: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v
