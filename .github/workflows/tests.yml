
name: NewHireToPayroll CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: newhire_payroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newhire_payroll"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/newhire_payroll
      PAYROLL_API_URL: http://127.0.0.1:8000/payroll/employees
      PAYROLL_API_KEY: ci-test-key-not-real
      MAX_ATTEMPTS: "3"
      RETRY_BASE_DELAY: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database tables
        run: |
          PGPASSWORD=ci_password psql -h localhost -U postgres -d newhire_payroll <<'SQL'
          CREATE TABLE employees (
              id SERIAL PRIMARY KEY,
              worker_code VARCHAR(50) UNIQUE NOT NULL,
              first_name VARCHAR(100) NOT NULL,
              last_name VARCHAR(100) NOT NULL,
              department_name VARCHAR(100) NOT NULL,
              job_title VARCHAR(150) NOT NULL,
              annual_salary NUMERIC(12, 2) NOT NULL CHECK (annual_salary > 0),
              joining_date DATE NOT NULL,
              pay_group VARCHAR(30) NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE integration_logs (
              id SERIAL PRIMARY KEY,
              worker_code VARCHAR(50) NOT NULL,
              integration_name VARCHAR(100) NOT NULL,
              status VARCHAR(20) NOT NULL
                  CHECK (status IN ('SUCCESS', 'FAILED', 'DUPLICATE')),
              message TEXT,
              processed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              retry_count INTEGER DEFAULT 0,
              execution_id VARCHAR(36)
          );

          CREATE TABLE integration_executions (
              execution_id VARCHAR(36) PRIMARY KEY,
              integration_name VARCHAR(100) NOT NULL,
              start_time TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
              end_time TIMESTAMP,
              final_status VARCHAR(30) NOT NULL DEFAULT 'RUNNING'
                  CHECK (final_status IN ('RUNNING', 'SUCCESS', 'PARTIAL_SUCCESS', 'FAILED')),
              total_records INTEGER NOT NULL DEFAULT 0,
              success_count INTEGER NOT NULL DEFAULT 0,
              failure_count INTEGER NOT NULL DEFAULT 0,
              duplicate_count INTEGER NOT NULL DEFAULT 0,
              retry_count INTEGER NOT NULL DEFAULT 0,
              message TEXT
          );
          SQL

      - name: Run automated tests
        run: pytest -v
